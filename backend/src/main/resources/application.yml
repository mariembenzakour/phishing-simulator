spring:
  application:
    name: phishsim

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/phishsim
    username: phishsim
    password: phishsim
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8086

# ✅ Configuration du chiffrement
app:
  encryption:
    password: phishsim-encryption-key-2026
    salt: phishsim-salt-2026