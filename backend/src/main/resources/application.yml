spring:
  application:
    name: phishsim

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/phishsim
    username: phishsim
    password: phishsim
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ✅ CONFIGURATION MAILPIT (pour les tests)
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8086
  address: 0.0.0.0

# ✅ Configuration du chiffrement
app:
  encryption:
    password: phishsim-encryption-key-2026
    salt: phishsim-salt-2026

  # ✅ Configuration des URLs (Cloudflare)
  base-url:   https://acid-cemetery-cpu-christopher.trycloudflare.com
  frontend-url: http://localhost:4200

  # ✅ Configuration de l'expéditeur (pour Mailpit, n'importe quelle adresse fonctionne)
  email:
    sender: test@intellisec.com
    sender-name: PhishSim Test

# ✅ Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always

# ✅ Configuration Gemini
ai:
  gemini:
    api:
      key: ${GEMINI_API_KEY}
    model: gemini-3.6-flash  # ✅ Recommandé (plus stable que 3.6)
  generation:
    max-tokens: 8192
    temperature: 0.7
  default-language: fr