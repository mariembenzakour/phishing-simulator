spring:
  application:
    name: phishsim

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/phishsim?useUnicode=true&characterEncoding=UTF-8
    username: phishsim
    password: phishsim
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ✅ NOUVEAU : Configuration des uploads multipart (ex: avatar lors de l'inscription)
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  # ✅ CONFIGURATION MAILPIT (Serveur SMTP local de test)
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        mime:
          allowutf8: true
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8086
  address: 0.0.0.0


# ✅ Configuration métier de PhishSim
app:
  encryption:
    password: phishsim-encryption-key-2026
    salt: phishsim-salt-2026

  # ✅ Configuration des URLs
  base-url: ${APP_BASE_URL:http://localhost:8086}
  frontend-url: http://localhost:4200

  # ✅ Configuration de l'expéditeur
  email:
    sender: security-admin@intellisecsolution.com
    sender-name: "Portail Sécurité IntelliSec"
    sender-domain-check: true

  # ✅ Serveur DNS utilisé pour la vérification SPF / DKIM / DMARC
  # Utiliser "system" pour le DNS de votre réseau local, ou "dns://8.8.8.8" pour Google DNS
  dns:
    server: "dns://8.8.8.8"

  # ✅ Configuration Rspamd (Vérification Anti-Spam / Délivrabilité)
  rspamd:
    url: http://localhost:11333/checkv2

# ✅ Niveaux de journaux (Logs)
logging:
  level:
    root: INFO
    com.intellisec.phishsim: DEBUG

# ✅ Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always

# ✅ Configuration Gemini AI - Modèle Principal et Modèle de Secours
ai:
  gemini:
    api:
      key: ${GEMINI_API_KEY}
    primary-model: gemini-3.5-flash
    fallback-model: gemini-2.5-flash
  generation:
    max-tokens: 8192
    temperature: 0.7
  default-language: fr