version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: phishsim
      POSTGRES_USER: phishsim
      POSTGRES_PASSWORD: phishsim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: