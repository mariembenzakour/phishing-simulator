<app-navbar></app-navbar>

<div style="background: #0a1628; min-height: calc(100vh - 64px); padding: 32px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
    <div>
      <h1 style="color: white; font-size: 28px; font-weight: 800; margin: 0;">👥 Groupes</h1>
      <p style="color: #8899aa; margin: 4px 0 0 0; font-size: 14px;">Organisez vos cibles par département</p>
    </div>
    <a *ngIf="authService.hasRole('ADMIN', 'OPERATOR')" routerLink="/groups/create"
       style="background: #e07b2a; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px;">
      + Nouveau groupe
    </a>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 60px;">
    <p style="color: #8899aa;">Chargement...</p>
  </div>

  <div *ngIf="!loading && groups.length === 0"
       style="text-align: center; padding: 60px; background: #0f1f35; border-radius: 12px; border: 1px dashed #1e3a5c;">
    <p style="color: #8899aa;">Aucun groupe pour le moment</p>
    <a *ngIf="authService.hasRole('ADMIN', 'OPERATOR')" routerLink="/groups/create"
       style="color: #e07b2a; text-decoration: none; font-weight: 600;">Créer le premier →</a>
  </div>

  <div *ngIf="!loading && groups.length > 0"
       style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
    <div *ngFor="let group of groups"
         style="background: #0f1f35; border-radius: 12px; padding: 24px; border: 1px solid #1e3a5c;">
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div>
          <h3 style="color: white; margin: 0 0 8px 0; font-size: 16px;">{{ group.name }}</h3>
          <a [routerLink]="['/targets']" [queryParams]="{groupId: group.id}"
             style="color: #e07b2a; font-size: 13px; text-decoration: none;">Voir les cibles →</a>
        </div>
        <button *ngIf="authService.isAdmin()" (click)="delete(group.id)"
                style="background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); color: #f87171; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;">
          🗑️
        </button>
      </div>
    </div>
  </div>
</div>
