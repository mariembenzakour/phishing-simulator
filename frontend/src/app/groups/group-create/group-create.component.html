<app-navbar></app-navbar>

<div class="create-container">
  <div class="create-wrapper">

    <!-- HEADER EN-TÊTE -->
    <div class="create-header">
      <a routerLink="/groups" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Retour aux groupes
      </a>
      <h1 class="page-title">Nouveau groupe</h1>
      <p class="page-subtitle">Définissez une nouvelle catégorie pour classifier vos cibles</p>
    </div>

    <!-- CARTE FORMULAIRE -->
    <div class="form-card">
      <div class="form-group">
        <label class="form-label">Nom du groupe <span class="required">*</span></label>
        <div class="input-wrapper">
          <input 
            type="text" 
            [(ngModel)]="name" 
            placeholder="Ex: Équipe RH, Direction General, IT..." 
            class="form-input"
            (keyup.enter)="create()"
            maxlength="40"
          >
          <span class="char-count" *ngIf="name.length > 0">{{ name.length }}/40</span>
        </div>
      </div>

      <!-- MESSAGES D'ALERTE -->
      <div *ngIf="error" class="banner error-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ error }}</span>
      </div>

      <div *ngIf="success" class="banner success-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>{{ success }}</span>
      </div>

      <!-- APERÇU EN TEMPS RÉEL (LIVE PREVIEW) -->
      <div class="preview-section">
        <span class="preview-title">Aperçu de la carte</span>
        <div class="preview-card">
          <div class="preview-avatar">
            {{ name.trim() ? name.charAt(0).toUpperCase() : '?' }}
          </div>
          <div class="preview-info">
            <span class="preview-name">{{ name.trim() || 'Nom du groupe' }}</span>
            <span class="preview-sub">0 cible associée</span>
          </div>
        </div>
      </div>

      <!-- BOUTON D'ACTION -->
      <button (click)="create()" class="btn-primary" [disabled]="!name.trim()">
        <span>Créer le groupe</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

  </div>
</div>
