<app-navbar></app-navbar>

<div style="background: #0a1628; min-height: calc(100vh - 64px); padding: 32px; display: flex; justify-content: center;">
  <div style="width: 100%; max-width: 500px;">

    <div style="margin-bottom: 32px;">
      <a routerLink="/groups" style="color: #8899aa; text-decoration: none; font-size: 14px;">← Retour</a>
      <h1 style="color: white; font-size: 28px; font-weight: 800; margin: 16px 0 4px 0;">Nouveau groupe</h1>
    </div>

    <div style="background: #0f1f35; border-radius: 12px; padding: 32px; border: 1px solid #1e3a5c;">
      <div style="margin-bottom: 24px;">
        <label style="color: #8899aa; font-size: 12px; font-weight: 600; display: block; margin-bottom: 8px; letter-spacing: 1px;">NOM DU GROUPE *</label>
        <input type="text" [(ngModel)]="name" placeholder="Ex: Équipe RH"
               style="width: 100%; padding: 12px 16px; background: #162032; border: 1px solid #1e3a5c; border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; outline: none;">
      </div>

      <div *ngIf="error" style="background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); color: #f87171; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">⚠️ {{ error }}</div>
      <div *ngIf="success" style="background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">✅ {{ success }}</div>

      <button (click)="create()" style="width: 100%; padding: 14px; background: #e07b2a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700;">
        CRÉER →
      </button>
    </div>
  </div>
</div>
