<app-navbar></app-navbar>

<div style="margin-left: 260px; background: #f5f7fa; min-height: calc(100vh - 64px); padding: 32px; display: flex; justify-content: center;">
  <div style="width: 100%; max-width: 500px;">

    <div style="margin-bottom: 32px;">
      <a routerLink="/targets" style="color: #6b7a8a; text-decoration: none; font-size: 14px;">← Retour</a>
      <h1 style="color: #1a3a5c; font-size: 28px; font-weight: 800; margin: 16px 0 4px 0;">Ajouter une cible</h1>
    </div>

    <div style="background: white; border-radius: 12px; padding: 32px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <div>
          <label style="color: #1a3a5c; font-size: 12px; font-weight: 600; display: block; margin-bottom: 8px; letter-spacing: 1px;">PRÉNOM *</label>
          <input type="text" [(ngModel)]="form.firstName" placeholder="Ahmed"
                 style="width: 100%; padding: 12px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; color: #1a3a5c; font-size: 14px; box-sizing: border-box; outline: none;">
        </div>
        <div>
          <label style="color: #1a3a5c; font-size: 12px; font-weight: 600; display: block; margin-bottom: 8px; letter-spacing: 1px;">NOM *</label>
          <input type="text" [(ngModel)]="form.lastName" placeholder="Ben Ali"
                 style="width: 100%; padding: 12px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; color: #1a3a5c; font-size: 14px; box-sizing: border-box; outline: none;">
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="color: #1a3a5c; font-size: 12px; font-weight: 600; display: block; margin-bottom: 8px; letter-spacing: 1px;">EMAIL *</label>
        <input type="email" [(ngModel)]="form.email" placeholder="ahmed.benali&#64;company.com"
               style="width: 100%; padding: 12px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; color: #1a3a5c; font-size: 14px; box-sizing: border-box; outline: none;">
      </div>

      <div style="margin-bottom: 28px;">
        <label style="color: #1a3a5c; font-size: 12px; font-weight: 600; display: block; margin-bottom: 8px; letter-spacing: 1px;">GROUPE *</label>
        <select [(ngModel)]="form.groupId"
                style="width: 100%; padding: 12px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; color: #1a3a5c; font-size: 14px; box-sizing: border-box; outline: none;">
          <option *ngFor="let group of groups" [value]="group.id">{{ group.name }}</option>
        </select>
      </div>

      <div *ngIf="error" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">⚠️ {{ error }}</div>
      <div *ngIf="success" style="background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">✅ {{ success }}</div>

      <button (click)="create()" style="width: 100%; padding: 14px; background: #e07b2a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700;">
        AJOUTER →
      </button>
    </div>
  </div>
</div>
