<app-navbar></app-navbar>

<div style="margin-left: 260px; background: #f5f7fa; min-height: calc(100vh - 64px); padding: 32px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
    <div>
      <h1 style="color: #1a3a5c; font-size: 28px; font-weight: 800; margin: 0;">🎯 Cibles</h1>
      <p style="color: #6b7a8a; margin: 4px 0 0 0; font-size: 14px;">Gérez les employés à tester</p>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <label style="background: #e8f0f7; color: #1a3a5c; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid #e2e8f0;">
        📂 Importer CSV
        <input type="file" (change)="onFileSelected($event)" accept=".csv" style="display: none;">
      </label>
      <a *ngIf="authService.hasAnyRole(['ADMIN', 'OPERATOR'])" routerLink="/targets/create"
         style="background: #e07b2a; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px;">
        + Ajouter une cible
      </a>
    </div>
  </div>

  <div *ngIf="uploadMessage" 
       [style.background]="uploadSuccess ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.1)'"
       [style.border]="uploadSuccess ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(239,68,68,0.3)'"
       [style.color]="uploadSuccess ? '#22c55e' : '#dc2626'"
       style="padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;">
    {{ uploadSuccess ? '✅' : '❌' }} {{ uploadMessage }}
  </div>

  <div style="margin-bottom: 24px;">
    <select (change)="onGroupChange($any($event.target).value)" [(ngModel)]="selectedGroupId"
            style="padding: 10px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; color: #1a3a5c; font-size: 14px; outline: none;">
      <option *ngFor="let group of groups" [value]="group.id">{{ group.name }}</option>
    </select>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 60px;">
    <p style="color: #6b7a8a;">Chargement...</p>
  </div>

  <div *ngIf="!loading && targets.length === 0"
       style="text-align: center; padding: 60px; background: white; border-radius: 12px; border: 1px dashed #e2e8f0;">
    <p style="color: #6b7a8a;">Aucune cible dans ce groupe</p>
    <a *ngIf="authService.hasAnyRole(['ADMIN', 'OPERATOR'])" routerLink="/targets/create"
       style="color: #e07b2a; text-decoration: none; font-weight: 600;">Ajouter la première →</a>
  </div>

  <div *ngIf="!loading && targets.length > 0"
       style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #e8f0f7;">
          <th style="padding: 16px; text-align: left; color: #1a3a5c; font-size: 12px; letter-spacing: 0.5px; font-weight: 600;">PRÉNOM</th>
          <th style="padding: 16px; text-align: left; color: #1a3a5c; font-size: 12px; letter-spacing: 0.5px; font-weight: 600;">NOM</th>
          <th style="padding: 16px; text-align: left; color: #1a3a5c; font-size: 12px; letter-spacing: 0.5px; font-weight: 600;">EMAIL</th>
          <th style="padding: 16px; text-align: left; color: #1a3a5c; font-size: 12px; letter-spacing: 0.5px; font-weight: 600;">ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let target of targets" style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 16px; color: #1a3a5c;">{{ target.firstName }}</td>
          <td style="padding: 16px; color: #1a3a5c;">{{ target.lastName }}</td>
          <td style="padding: 16px; color: #6b7a8a;">{{ target.email }}</td>
          <td style="padding: 16px;">
            <button *ngIf="authService.isAdmin()" (click)="delete(target.id)"
                    style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #dc2626; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">
              🗑️ Supprimer
            </button>
            <span *ngIf="!authService.isAdmin()" style="color: #8899aa; font-size: 12px;">Lecture seule</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
