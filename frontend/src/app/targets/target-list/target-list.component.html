<app-navbar></app-navbar>

<div style="background: #0a1628; min-height: calc(100vh - 64px); padding: 32px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
    <div>
      <h1 style="color: white; font-size: 28px; font-weight: 800; margin: 0;">🎯 Cibles</h1>
      <p style="color: #8899aa; margin: 4px 0 0 0; font-size: 14px;">Gérez les employés à tester</p>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <!-- ✅ BOUTON IMPORT CSV -->
      <label style="background: #1e3a5c; color: #8899aa; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid #2a4a6c;">
        📂 Importer CSV
        <input type="file" (change)="onFileSelected($event)" accept=".csv" style="display: none;">
      </label>
      
      <a *ngIf="authService.hasAnyRole(['ADMIN', 'OPERATOR'])" routerLink="/targets/create"
         style="background: #e07b2a; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px;">
        + Ajouter une cible
      </a>
    </div>
  </div>

  <!-- ✅ MESSAGE D'UPLOAD -->
  <div *ngIf="uploadMessage" 
       [style.background]="uploadSuccess ? 'rgba(34,197,94,0.1)' : 'rgba(220,38,38,0.1)'"
       [style.border]="uploadSuccess ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(220,38,38,0.3)'"
       [style.color]="uploadSuccess ? '#4ade80' : '#f87171'"
       style="padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;">
    {{ uploadSuccess ? '✅' : '❌' }} {{ uploadMessage }}
  </div>

  <div style="margin-bottom: 24px;">
    <select (change)="onGroupChange($any($event.target).value)" [(ngModel)]="selectedGroupId"
            style="padding: 10px 16px; background: #0f1f35; border: 1px solid #1e3a5c; border-radius: 8px; color: white; font-size: 14px; outline: none;">
      <option *ngFor="let group of groups" [value]="group.id">{{ group.name }}</option>
    </select>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 60px;">
    <p style="color: #8899aa;">Chargement...</p>
  </div>

  <div *ngIf="!loading && targets.length === 0"
       style="text-align: center; padding: 60px; background: #0f1f35; border-radius: 12px; border: 1px dashed #1e3a5c;">
    <p style="color: #8899aa;">Aucune cible dans ce groupe</p>
    <a *ngIf="authService.hasAnyRole(['ADMIN', 'OPERATOR'])" routerLink="/targets/create"
       style="color: #e07b2a; text-decoration: none; font-weight: 600;">Ajouter la première →</a>
  </div>

  <div *ngIf="!loading && targets.length > 0"
       style="background: #0f1f35; border-radius: 12px; overflow: hidden; border: 1px solid #1e3a5c;">
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #162032;">
          <th style="padding: 16px; text-align: left; color: #8899aa; font-size: 12px; letter-spacing: 1px;">PRÉNOM</th>
          <th style="padding: 16px; text-align: left; color: #8899aa; font-size: 12px; letter-spacing: 1px;">NOM</th>
          <th style="padding: 16px; text-align: left; color: #8899aa; font-size: 12px; letter-spacing: 1px;">EMAIL</th>
          <th style="padding: 16px; text-align: left; color: #8899aa; font-size: 12px; letter-spacing: 1px;">ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let target of targets" style="border-top: 1px solid #1e3a5c;">
          <td style="padding: 16px; color: white;">{{ target.firstName }}</td>
          <td style="padding: 16px; color: white;">{{ target.lastName }}</td>
          <td style="padding: 16px; color: #8899aa;">{{ target.email }}</td>
          <td style="padding: 16px;">
            <button *ngIf="authService.isAdmin()" (click)="delete(target.id)"
                    style="background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); color: #f87171; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">
              🗑️ Supprimer
            </button>
            <span *ngIf="!authService.isAdmin()" style="color: #556677; font-size: 12px;">Lecture seule</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
