<div class="intellisec-auth-layout">
  
  <!-- Section Gauche : Arrière-plan identique aux autres pages -->
  <div class="code-panel">
    <div class="dark-vignette"></div>
  </div>

  <!-- Section Droite : Formulaire Configuration MFA -->
  <div class="form-panel">
    <div class="form-box">
      
      <!-- Logo Officiel Intellisec -->
      <div class="form-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" class="intellisec-svg-logo-small">
          <g transform="translate(10, 20)">
            <path d="M 12,24 L 12,10 M 12,10 A 3,3 0 1,1 12,4 A 3,3 0 1,1 12,10" stroke="#E07B2A" stroke-width="2.5" fill="none"/>
            <path d="M 46,24 L 46,2 M 46,2 A 3,3 0 1,1 46,-4 A 3,3 0 1,1 46,2" stroke="#E07B2A" stroke-width="2.5" fill="none"/>
            <path d="M 68,24 L 68,12 M 68,12 A 3,3 0 1,1 68,6 A 3,3 0 1,1 68,12" stroke="#E07B2A" stroke-width="2.5" fill="none"/>
            <path d="M 85,24 L 85,4 M 85,4 A 3,3 0 1,1 85,-2 A 3,3 0 1,1 85,4" stroke="#E07B2A" stroke-width="2.5" fill="none"/>
            
            <text x="0" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#E07B2A">INTELLI</text>
            <text x="140" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#0B1B3D">SEC</text>
            <text x="2" y="62" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#0B1B3D" letter-spacing="8.5">SOLUTIONS</text>
          </g>
        </svg>
      </div>

      <div class="form-header">
        <h2 class="auth-title">Configuration MFA</h2>
        <p class="auth-subtitle">Scannez ce QR code avec Google Authenticator pour sécuriser votre compte</p>
      </div>

      <div class="setup-container">
        
        <!-- Affichage du QR Code -->
        <div *ngIf="qrUrl" class="qr-wrapper">
          <div class="qr-card">
            <img [src]="qrUrl" alt="QR Code MFA" class="qr-image">
          </div>
        </div>

        <!-- Chargement -->
        <div *ngIf="!qrUrl && !error" class="loading-wrapper">
          <div class="loading-box">
            <span class="loading-text">Génération du QR code...</span>
          </div>
        </div>

        <!-- Alerte Avertissement -->
        <div class="warning-alert">
          <span class="warning-icon">⚠️</span>
          <p class="warning-text">Scannez ce QR code <strong>maintenant</strong> — il ne sera plus affiché par la suite.</p>
        </div>

        <!-- Alerte Erreur -->
        <div *ngIf="error" class="error-alert">
          <span class="error-badge">ERREUR</span>
          <span class="error-text">{{ error }}</span>
        </div>

        <!-- Bouton Continuer -->
        <button (click)="next()" class="btn-primary">
          J'AI SCANNÉ — CONTINUER →
        </button>

      </div>

      <div class="form-footer">
        <a routerLink="/login" class="footer-link">← Retour à la connexion</a>
      </div>

    </div>
  </div>

</div>
