<nav style="background: #0f1f35; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">

  <!-- Logo officiel INTELLISEC SOLUTIONS -->
  <div style="display: flex; align-items: center;">
    <img
      src="/logo.png"
      alt="INTELLISEC SOLUTIONS"
      style="width: 130px; height: auto; display: block;"
    >
  </div>

  <!-- Liens principaux -->
  <div style="display: flex; align-items: center; gap: 4px;">

    <a
      routerLink="/campaigns"
      routerLinkActive="active-nav"
      style="color: #8899aa; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;"
    >
      📣 Campagnes
    </a>

    <a
      routerLink="/groups"
      routerLinkActive="active-nav"
      style="color: #8899aa; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;"
    >
      👥 Groupes
    </a>

    <a
      routerLink="/targets"
      routerLinkActive="active-nav"
      style="color: #8899aa; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500;"
    >
      🎯 Cibles
    </a>

    <a
      *ngIf="authService.isAdmin() || authService.isSuperAdmin()"
      routerLink="/operators/create"
      routerLinkActive="active-nav"
      style="color: #e07b2a; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; border: 1px solid rgba(224,123,42,0.3);"
    >
      👑 Opérateurs
    </a>

  </div>

  <!-- Profil -->
  <div style="display: flex; align-items: center; gap: 16px;">

    <div style="text-align: right;">

      <div style="color: white; font-size: 13px; font-weight: 600;">
        {{ authService.getUserInfo()?.email }}
      </div>

      <span
        style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; display: inline-block;"
        [style.background]="authService.isSuperAdmin() ? 'rgba(224,123,42,0.3)' : authService.isAdmin() ? 'rgba(224,123,42,0.2)' : authService.isOperator() ? 'rgba(59,130,246,0.2)' : 'rgba(34,197,94,0.2)'"
        [style.color]="authService.isSuperAdmin() ? '#e07b2a' : authService.isAdmin() ? '#e07b2a' : authService.isOperator() ? '#60a5fa' : '#4ade80'"
      >
        {{
          authService.isSuperAdmin()
            ? '⭐ SUPER_ADMIN'
            : authService.isAdmin()
              ? 'ADMIN'
              : authService.isOperator()
                ? 'OPERATOR'
                : 'VIEWER'
        }}
      </span>

    </div>

    <button
      (click)="logout()"
      style="background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); color: #f87171; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;"
    >
      Déconnexion
    </button>

  </div>

</nav>

<style>
  .active-nav {
    color: #e07b2a !important;
    background: rgba(224, 123, 42, 0.1) !important;
  }
</style>
